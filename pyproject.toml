[project]
name = "scholastic-llm"
version = "0.0.1"
description = "Fine-tune Qwen 2.5 to debate philosophy in a scholastic register, grounded in the Catechism of the Catholic Church"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Pablo Leyva" }]
keywords = ["llm", "fine-tuning", "mlx", "lora", "scholastic", "catechism", "philosophy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mlx-lm>=0.31",
    "mlx-lm-lora>=2.1",
    "anthropic>=0.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "datasets>=2.20",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scholastic"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
