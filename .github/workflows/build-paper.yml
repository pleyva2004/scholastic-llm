name: Build paper

on:
  push:
    branches: [main]
    paths:
      - 'paper/**'
      - '.github/workflows/build-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # need full history so we can commit back
          fetch-depth: 0
          # use the default token; permissions above gives it write access
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: main.tex
          latexmk_use_lualatex: false
          latexmk_shell_escape: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholastic-llm-paper
          path: paper/main.pdf

      - name: Sync rendered PDF into docs/ (for GitHub Pages + in-tree visibility)
        run: |
          mkdir -p docs
          cp paper/main.pdf docs/main.pdf

      - name: Commit updated PDF back to main
        # Skip on PRs from forks (no write token) and on tag builds (no need to commit).
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/main.pdf
          if git diff --staged --quiet; then
            echo "No PDF change; nothing to commit."
            exit 0
          fi
          git commit -m "Update rendered PDF in docs/ [skip ci]" \
                     -m "Auto-generated by .github/workflows/build-paper.yml"
          git push

      - name: Attach PDF to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: paper/main.pdf
