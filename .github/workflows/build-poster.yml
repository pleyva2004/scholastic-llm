name: Build poster

on:
  push:
    branches: [main]
    paths:
      - 'poster/**'
      - '.github/workflows/build-poster.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: poster
          root_file: main.tex
          # Gemini beamerposter theme pulls in fontspec, which requires
          # XeLaTeX or LuaLaTeX (NOT pdfLaTeX).
          latexmk_use_lualatex: true
          latexmk_shell_escape: true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: scholastic-llm-poster
          path: poster/main.pdf

      - name: Sync rendered poster into docs/ (for GitHub Pages + in-tree visibility)
        run: |
          mkdir -p docs
          cp poster/main.pdf docs/poster.pdf

      - name: Commit updated poster back to main
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/poster.pdf
          if git diff --staged --quiet; then
            echo "No poster change; nothing to commit."
            exit 0
          fi
          git commit -m "Update rendered poster in docs/ [skip ci]" \
                     -m "Auto-generated by .github/workflows/build-poster.yml"
          git push

      - name: Attach poster to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: poster/main.pdf
